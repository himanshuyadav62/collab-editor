services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_COLLAB_SERVER_URL=ws://collab:1234
      - VITE_API_URL=http://api:3001
    depends_on:
      - collab
      - api

  collab:
    build:
      context: ../..
      dockerfile: infra/docker/collab.Dockerfile
    ports:
      - "1234:1234"
    environment:
      - PORT=1234
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/collab_editor
    depends_on:
      - db

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/collab_editor
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=collab_editor
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
