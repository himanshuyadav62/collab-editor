version: '3.8'

services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_COLLAB_SERVER_URL=ws://collab:1234
    depends_on:
      - collab

  collab:
    build:
      context: ../..
      dockerfile: infra/docker/collab.Dockerfile
    ports:
      - "1234:1234"
    environment:
      - PORT=1234
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/collab_editor
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=collab_editor
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
